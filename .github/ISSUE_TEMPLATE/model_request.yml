name: Suggest a model or an improvement
description: Ask for a new model, a variant of one, a missing category or tag, or a feature of the browser
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please search the [asset browser](https://khanjal.github.io/lowpoly-assets/) first: the model may already exist, or exist as a variant (another colour, style or condition).

        Models here are generated by scripts in one flat-shaded low-poly style with a shared palette. Real, generic objects fit best (a wheelbarrow, a park bench, a different breed of dog). Branded products, characters from other works and realistic or scanned models do not.

        Issues are public. Please do not include anything private.

  - type: dropdown
    id: kind
    attributes:
      label: What is it
      options:
        - A new model
        - A variant of an existing model (colour, style, damaged...)
        - A missing category or tag
        - A feature of the asset browser
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What would you like
      description: The real object, and which kind of it (a wedge or a wheel of cheese; a box ambulance or a van). For a variant, which model.
    validations:
      required: true

  - type: input
    id: size
    attributes:
      label: Roughly how big, in metres
      placeholder: "0.5 wide, 0.9 high"

  - type: textarea
    id: features
    attributes:
      label: Three to five features that make it recognisable
      description: What makes it look like that thing and not another.

  - type: textarea
    id: use
    attributes:
      label: What you would use it for
      description: A game genre, an engine, a scene. It helps decide the origin, whether parts should move, and how detailed it should be.

  - type: textarea
    id: moving
    attributes:
      label: Should anything move or animate
      description: A door that opens, a lid, a drawer, a walk cycle. Only hinged and sliding parts, and the animals' and people's clips, exist today.

  - type: textarea
    id: refs
    attributes:
      label: Reference links
      description: Links only, please, to pictures that show the kind of object. Do not attach copyrighted images or models.

  - type: checkboxes
    id: terms
    attributes:
      label: Before you send
      options:
        - label: I searched the asset browser and did not find it.
          required: true
        - label: If this leads to a model or a change, it becomes part of the project under its licences (code MIT, models and data CC BY 4.0).
        - label: I would like to try making it myself (see CONTRIBUTING.md).
