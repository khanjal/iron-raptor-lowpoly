name: Problem with a model
description: A model looks wrong, faces the wrong way, has a floating or missing part, or does not move or animate properly
labels: ["bug", "area:generators"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Models are generated by scripts, so a precise report (which model, what is wrong, where you saw it) usually means a quick fix.

        Issues are public. Please do not include anything private.

  - type: input
    id: model
    attributes:
      label: Which model
      description: The id shown in the asset browser (the name in the address after `#`, for example `GV_Sedan_Blue_01`), or a link to it.
      placeholder: "GV_Sedan_Blue_01"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - A part floats, is buried or is missing
        - It faces the wrong way, or is tilted or upside down
        - Wrong size or the origin (pivot) is in the wrong place
        - It looks solid but should be hollow (or the reverse)
        - A moving part (door, drawer, lid) turns or slides the wrong way
        - An animation clip looks wrong
        - A colour or the glow looks wrong
        - Too many (or too few) triangles for what it is
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what you expected
      description: A screenshot helps a lot. Drag it in, or describe which part and from which side.
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where you saw it
      options:
        - The asset browser on the project's site
        - Blender
        - Unity
        - Godot
        - Unreal Engine
        - Another viewer or engine
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Engine or viewer and version, file format
      description: Needed when it is not the asset browser. For example "Godot 4.4, the GLB" or "Unity 6, the FBX".
      placeholder: "Godot 4.4, GLB"

  - type: textarea
    id: steps
    attributes:
      label: Import settings or steps to see it
      description: For an engine, what you changed from the defaults. For the browser, what to click.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I looked at the "Using the models in your engine" section of the README (many problems are import settings).
        - label: I am not attaching files that I do not have the right to share.
