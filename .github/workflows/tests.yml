# The cheap checks: Python unit tests (manifest builder, axis conversion of the moving parts, catalog rules), the site consistency check (every manifest entry
# has its GLB and thumbnail, valid fields, unique ids, every part names a node in the GLB at the right pivot, the page's files exist) and a syntax check of the
# site's JavaScript. Standard library only, no Blender and no browser: about half a minute.
#
# MINUTES: the repository is private on the Free plan, which has a limited monthly allowance of Actions minutes, so this runs only
#   * when started by hand (Actions > Tests > Run workflow), and
#   * on a push to a branch that is not main (a draft PR's branch), when a file the checks read changes.
# It does not run on pull_request, on a schedule, or on main. When the repository is public (Actions are free there) widen the triggers.
name: Tests

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "site/**"
      - "tools/**"
      - "tests/**"
      - "art/scripts/common.py"
      - "art/data/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Site consistency
        run: python3 tools/check_site.py
