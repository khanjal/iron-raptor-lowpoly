# The cheap checks: Python unit tests (manifest builder, axis conversion of the moving parts, catalog rules), the site consistency check (every manifest entry
# has its GLB and thumbnail, valid fields, unique ids, every part names a node in the GLB at the right pivot, the page's files exist) and a syntax check of the
# site's JavaScript. Standard library only, no Blender and no browser: about half a minute.
#
# Runs on every pull request, on every push to main and by hand (Actions > Tests > Run workflow). The repository is public since 2026-10-23, where Actions on
# the standard runners do not use the account's private-repository allowance. (While it was private on the Free plan, GitHub refused to start this job:
# "recent account payments have failed or your spending limit needs to be increased".)
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Site consistency
        run: python3 tools/check_site.py
